[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdesk-ai"
version = "0.1.0"
description = "IT and HR support assistant with knowledge retrieval and ticket workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.92",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
